[package]
name = "real-useful-newtabs"
version = "0.1.1"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-only"

[dependencies]
eframe = { version = "0.36.0", default-features = false, features = [
    "default",
    "persistence",
] }
egui = { version = "0.36.0", features = ["persistence"] }
log = "0.4.27"
ron = "0.12"
serde = { version = "1.0", features = ["derive"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11.8"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
wasm-bindgen = "*"
wasm-bindgen-futures = "0.4.50"
web-sys = { version = "0.3.70", features = [
    "Document",
    "Element",
    "HtmlCanvasElement",
    "Window",
] }

[profile.release]
# Favor the smallest release artifact and lowest code footprint, especially for WASM.
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.dev.package."*"]
opt-level = 2
